<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Page</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(45deg, blue, #ff4fc3);
            background-attachment: fixed;
            background-position: center;
            background-size: cover;

            color: white;
        }

        h1 {
            color: white;
            text-align: center;
            margin: 20px 10px;
            font-size: clamp(28px, 5vw, 45px);
        }

        /* Navigation */
        .navigation {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
        }

        .nav-btn {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.95);
            color: #666;
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
            font-size: 16px;
        }

        .nav-btn i {
            margin-right: 7px;
        }

        .nav-btn:hover {
            background: white;
            color: #163b7a;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }

        /* Contact Form Container */
        .container {
            width: 90%;
            max-width: 750px;
            margin: 20px auto 50px;
            padding: 30px;
            border-radius: 25px;

            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(8px);
        }

        form {
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 16px;
        }

        input[type="text"],
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 0 auto 18px;

            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;

            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border: 2px solid #4d90fe;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* Submit Button */
        input[type="submit"] {
            display: block;
            width: 160px;
            max-width: 100%;

            background-color: #04AA6D;
            color: white;

            padding: 13px 20px;
            border: none;
            border-radius: 6px;

            cursor: pointer;
            font-size: 16px;
            font-weight: bold;

            margin: 5px auto 0;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .container {
                width: 92%;
                padding: 25px;
            }

            .navigation {
                padding: 15px;
            }
        }

        /* Mobile Phone */
        @media (max-width: 480px) {
            .navigation {
                padding: 12px;
            }

            .nav-btn {
                width: 100%;
                text-align: center;
                padding: 11px;
            }

            h1 {
                font-size: 30px;
                margin: 15px 10px;
            }

            .container {
                width: 94%;
                padding: 20px 15px;
                margin: 15px auto 30px;
                border-radius: 18px;
            }

            label {
                font-size: 15px;
            }

            input[type="text"],
            select,
            textarea {
                font-size: 16px;
                padding: 12px;
            }

            textarea {
                min-height: 130px;
            }

            input[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="index.html" class="nav-btn">
            <i class="fa-solid fa-house"></i>
            Back to Home
        </a>
    </div>

    <h1>Contact Us!</h1>

    <div class="container">

        <form action="action_page.php">

            <label for="fname">First Name</label>
            <input
                type="text"
                id="fname"
                name="firstname"
                placeholder="Your Name"
            >

            <label for="lname">Last Name</label>
            <input
                type="text"
                id="lname"
                name="lastname"
                placeholder="Your Last Name"
            >

            <label for="country">Country</label>
            <select id="country" name="country">
                <option value="Philippines">Philippines</option>
                <option value="USA">USA</option>
                <option value="Singapore">Singapore</option>
            </select>

            <label for="subject">Subject</label>
            <textarea
                id="subject"
                name="subject"
                placeholder="Write something..."
            ></textarea>

            <input type="submit" value="Submit">

        </form>

    </div>

</body>
</html>
