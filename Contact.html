<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Page</title>
<link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body {
	background: linear-gradient(45deg,blue, #ff4fc3);
	object-fit: cover;
	background-attachment: fixed;
	background-position: center;
	background-size: cover;
	overflow: hidden;
	position: relative;
}
h1{
color: white;
}
/* Style inputs with type="text", select elements and textareas */
input[type=text], select, textarea {
	text-align: center;
	width: 80%; 
	padding: 12px; 
	border: 1px solid #ccc;
	border-radius: 4px; 
	box-sizing: border-box; 
	margin-top: 6px;
	margin-bottom: 16px; 
	resize: vertical;
}

/* Style the submit button with a specific background color etc */
input[type=submit] {
	background-color: #04AA6D;
	color: white;
	padding: 12px 20px;
	border: none;
	border-radius: 4px;
	cursor: pointer;
}

/* When moving the mouse over the submit button, add a darker green color */
input[type=submit]:hover {
	background-color: #45a049;
}

/* Add a background color and some padding around the form */
.container {
	border-radius: 37px;
	width:70%;
	max-width: 7700px;
	background-color: #f2f2f2;
	padding: 30px;
	color:white;
	background:transparent;
	margin:50px auto;
	border: solid 2px;   
}
.navigation {
	margin: 20px;
	display: flex;
	justify-content: left;
	flex-wrap: wrap;
	gap: 12px;
}
.nav-btn {
	text-decoration: none;
	background: rgba(255, 255, 255, 0.9);
	color: #666;
	padding: 12px 25px;
	min-width: 110px;
	border-radius: 4px;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
	transition: 0.3s;
}
.nav-btn i {
	margin-right: 7px;
}
.nav-btn:hover {
	background: white;
	color: #163b7a;
	transform: translateY(-3px);
	box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
}
</style>
</head>
<body>
<div class="navigation">
<a href="Homepage.html" class="nav-btn">
<i class="fa-solid fa-house"></i>
Back to Home
</a>
</div>
<center><h1>Contact Us!</h1></center>
<div class="container">
  <form action="action_page.php">
  <center>
    <label for="subject">First Name</label><br>
    <input type="text" id="fname" name="firstname" placeholder="Your Name">
    <br><label for="subject">Last Name</label><br>
    <input type="text" id="lname" name="lastname" placeholder="Your Last Name">
    <br><label for="subject">Country</label><br>
    <select id="country" name="country">
	<option value="Bag-ong Oslob">Philippines</option>
	<option value="Lantungan">USA</option>
	<option value="Lubid">Singapore</option><br>
    </select>
   <br> <label for="subject">Subject</label><br>
    <textarea id="subject" name="subject" placeholder="Write something..." style="height:200px"></textarea></center> 

   <br> <br><center><input type="submit" value="Submit"></center>

  </form>
</div>
</body>
</html>
